name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DATABASE_URL secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "\nERROR: DATABASE_URL is not configured for this repository.\n" >&2
            echo "Add the DATABASE_URL secret to Settings → Secrets and variables → Actions." >&2
            echo "Example: postgres://user:pass@host:5432/dbname" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Ensure database schema is in sync
        run: |
          # Prefer applying versioned migrations in production (safer):
          # If no migrations are present or `deploy` fails, fall back to `db push`.
          npx prisma migrate deploy || npx prisma db push

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: (optional) Run tests
        run: |
          if [ -f package.json ] && npm test --silent; then
            echo "Tests executed";
          else
            echo "No tests defined or tests skipped";
          fi
